name: Android APK Uretici

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: # Bu sayede istediğiniz zaman manuel olarak da tetikleyebilirsiniz

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 1. Kodlari Sunucuya Cek
      uses: actions/checkout@v4

    - name: 2. Java Ortamini Kur
      uses: actions/setup-java@v4
      with:
        java-version: '17' # Android icin en kararli surumlerden biri
        distribution: 'temurin'

    - name: 3. Gradle Izinlerini Ayarla
      run: chmod +x gradlew

    - name: 4. APK'yi Derle
      run: ./gradlew assembleDebug

    - name: 5. APK Dosyasini İndirilebilir Hale Getir
      uses: actions/upload-artifact@v4
      with:
        name: Uygulama-APK-Dosyasi
        path: app/build/outputs/apk/debug/app-debug.apk
