name: React Native / Expo APK Uretici

on:
  workflow_dispatch: # Sadece manuel tetikleme ile çalışsın

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 1. Kodlari Sunucuya Cek
      uses: actions/checkout@v4

    - name: 2. Node.js Kurulumu (JavaScript icin)
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: 3. Java Kurulumu (Android icin)
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: 4. Kutuphaneleri Yukle (Frontend Klasorunde)
      working-directory: ./frontend
      run: npm install

    - name: 5. Android Altyapisini Olustur (Prebuild)
      working-directory: ./frontend
      run: npx expo prebuild --platform android

    - name: 6. APK'yi Derle
      working-directory: ./frontend/android
      run: ./gradlew assembleDebug

    - name: 7. APK Dosyasini İndirilebilir Hale Getir
      uses: actions/upload-artifact@v4
      with:
        name: Uygulama-APK-Dosyasi
        path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
